name: CI

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dotnet-logging:
        required: true
        type: choice
        default: minimal
        options:
          - quiet
          - minimal
          - normal
          - detailed
          - diagnostic

jobs:
  all:
    if: github.run_id != 1
    name: Build & Tests
    uses: dailydevops/pipelines/.github/workflows/build-dotnet-matrix.yml@2c31d49d417be256d3700a0d29fca0e50a8313cf # 2.5.335
    with:
      dotnetLogging: ${{ inputs.dotnet-logging }}
      # The repository variable overrides the organisation default, because this repository
      # deliberately tests down to net6.0 and every runtime has to be installed for its target
      # framework to run at all.
      dotnetVersion: ${{ vars.NE_DOTNET_TARGETFRAMEWORKS }}
      disablePrebuild: true
      # Linux is on by default, Windows is enabled below. The classic target frameworks only build on
      # Windows, so that leg is the only one covering net472, net48 and net481. macOS is disabled outright.
      disableTestsOnWindows: false
      disableTestsOnMacOs: true
      # A platform-specific failure must not hide the others; that is the point of the matrix.
      failFast: false
      solution: ./FrameShift.slnx
    secrets: inherit
