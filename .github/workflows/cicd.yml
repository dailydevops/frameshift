name: CI

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dotnet-logging:
        required: true
        type: choice
        default: minimal
        options:
          - quiet
          - minimal
          - normal
          - detailed
          - diagnostic

jobs:
  all:
    if: github.run_id != 1
    name: Build & Tests
    uses: dailydevops/pipelines/.github/workflows/build-dotnet-matrix.yml@1328ca628f65591318b771c4e7c01794ddab583f # 2.5.140
    with:
      dotnetLogging: ${{ inputs.dotnet-logging }}
      # The repository variable overrides the organisation default, because this repository
      # deliberately tests down to net6.0 and every runtime has to be installed for its target
      # framework to run at all.
      dotnetVersion: ${{ vars.NE_DOTNET_TARGETFRAMEWORKS }}
      # Linux is on by default, the other two are not. The classic target frameworks only build on
      # Windows, so that leg is the only one covering net472, net48 and net481.
      disableTestsOnWindows: false
      disableTestsOnMacOs: false
      # A platform-specific failure must not hide the others; that is the point of the matrix.
      failFast: false
      solution: ./FrameShift.slnx
    secrets: inherit
